<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIKA - Driver Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <main class="login-container">
        <div class="login-header">
            <h1 class="logo-large">FIKA.</h1>
            <p>Create your Driver Account</p>
        </div>

        <div class="card login-card" id="reg-step-phone">
            <h2>Register Mobile</h2>
            <div class="input-group">
                <span class="country-code">+91</span>
                <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit Mobile Number" maxlength="10">
            </div>
            <button class="btn btn-primary" onclick="showRegOTP()">Send OTP</button>
            <p style="text-align:center; margin-top:15px; font-size:0.9rem;">
                Already registered? <a href="login.html" style="color:var(--primary); font-weight:bold;">Login Here</a>
            </p>
        </div>

        <div class="card login-card hidden" id="reg-step-otp">
            <h2>Verify Mobile</h2>
            <p class="login-subtitle">Enter the 4-digit code sent to your phone.</p>
            <div class="otp-group">
                <input type="number" class="otp-input" maxlength="1"><input type="number" class="otp-input" maxlength="1">
                <input type="number" class="otp-input" maxlength="1"><input type="number" class="otp-input" maxlength="1">
            </div>
            <button class="btn btn-primary" onclick="showRegProfile()">Verify Code</button>
        </div>

        <div class="card login-card hidden" id="reg-step-profile">
            <h2>Driver Details</h2>
            <p class="login-subtitle">This info secures your automated payouts.</p>
            <input type="text" id="reg-name" class="form-control" placeholder="Full Name" style="margin-bottom: 15px; width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px;">
            <input type="text" id="reg-upi" class="form-control" placeholder="UPI ID (e.g., 9876543210@ybl)" style="margin-bottom: 15px; width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px;">
            <select id="reg-vehicle" class="form-control" style="margin-bottom: 20px; width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 8px;">
                <option value="motorcycle">Motorcycle</option>
                <option value="bicycle">Bicycle</option>
                <option value="ev">EV Scooter</option>
            </select>
            <button class="btn btn-primary" onclick="submitRegistrationToDB()">Complete Registration</button>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
